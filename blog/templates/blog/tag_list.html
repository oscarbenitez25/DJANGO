{% extends "blog/base.html" %}

{% block title %}Tags — Django Blog{% endblock %}

{% block content %}
<h1 class="mb-4">🏷️ Tags</h1>

{% if tags %}
    <div class="row g-3">
        {% for tag in tags %}
            <div class="col-auto">
                <a href="{% url 'tag_posts' tag.caption %}"
                   class="btn btn-outline-secondary btn-lg">
                    # {{ tag.caption }}
                    <span class="badge bg-secondary ms-1">
                        {{ tag.post_set.count }}
                    </span>
                </a>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">Encara no hi ha tags creades.</div>
{% endif %}
{% endblock %}
