{% load static %}
{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    {% bootstrap_css %}
    <link rel="stylesheet" href="{% static 'blog/css/styles.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">
                📝 Django Blog
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Inici</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'posts' %}">Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'authors' %}">Autors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tags' %}">Tags</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contingut principal -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2024 Django Blog — Fet amb ❤️ i Django</p>
            <small>
                <a class="text-secondary" href="{% url 'index' %}">Inici</a> ·
                <a class="text-secondary" href="{% url 'posts' %}">Posts</a> ·
                <a class="text-secondary" href="{% url 'authors' %}">Autors</a> ·
                <a class="text-secondary" href="{% url 'tags' %}">Tags</a>
            </small>
        </div>
    </footer>

    {% bootstrap_javascript %}
</body>
</html>
