{% load static %}
<div class="card h-100 shadow-sm">
    {% if post.image %}
        <img src="{{ post.image.url }}" class="card-img-top" alt="{{ post.title }}"
             style="height: 200px; object-fit: cover;">
    {% else %}
        <img src="{% static 'blog/images/default.jpg' %}" class="card-img-top"
             alt="Imatge per defecte" style="height: 200px; object-fit: cover;">
    {% endif %}

    <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ post.title }}</h5>
        <p class="card-text text-muted small">
            📅 {{ post.date }} &nbsp;|&nbsp;
            ✍️ <a href="{% url 'author_detail' post.author.id %}">{{ post.author }}</a>
        </p>
        <p class="card-text">{{ post.excerpt }}</p>

        {% if post.tags.all %}
            <div class="mb-2">
                {% for tag in post.tags.all %}
                    <a href="{% url 'tag_posts' tag.caption %}"
                       class="badge bg-secondary text-decoration-none me-1">
                        # {{ tag.caption }}
                    </a>
                {% endfor %}
            </div>
        {% endif %}

        <a href="{% url 'post_detail' post.slug %}"
           class="btn btn-primary mt-auto">
            Llegir més →
        </a>
    </div>
</div>
