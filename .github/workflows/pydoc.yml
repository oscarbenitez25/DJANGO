name: Generate Pydoc Documentation

on:
  push:
    branches: [ "main", "master" ]

# Permisos totals perquè l'Action pugui crear la branca gh-pages i gestionar GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Instal·lar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar documentació Pydoc
        run: |
          mkdir -p docs
          
          # Configurem les rutes perquè Pydoc i Django sàpiguen on és cada mòdul
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export DJANGO_SETTINGS_MODULE=my_site.settings
          
          # Generem els fitxers HTML utilitzant Pydoc
          python -m pydoc -w blog.models
          python -m pydoc -w blog.views
          python -m pydoc -w blog.urls
          python -m pydoc -w blog.admin
          
          # Movem tots els HTML generats a la carpeta docs
          mv blog.models.html blog.views.html blog.urls.html blog.admin.html docs/
          
          # Creem el fitxer index.html (duplicant el de models) perquè GitHub Pages tingui una pàgina d'inici
          cp docs/blog.models.html docs/index.html

      - name: Pujar documentació a GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
