name: Generate Pydoc Documentation

on:
  push:
    branches: [ "main", "master" ]

# Afegim permisos explícits perquè l'Action pugui escriure a la branca gh-pages
permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Instal·lar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar documentació Pydoc
        run: |
          mkdir -p docs
          # Definim el PYTHONPATH perquè Pydoc trobi la teva app 'blog' i la configuració de Django
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          
          # Generem els HTML
          python -m pydoc -w blog.models
          python -m pydoc -w blog.views
          python -m pydoc -w blog.urls
          python -m pydoc -w blog.admin
          
          # Movem els HTML generats a la carpeta docs
          mv blog.models.html blog.views.html blog.urls.html blog.admin.html docs/
          
          # Creem un index.html (per exemple, copiant el de models) perquè GitHub Pages sàpiga quina és la pàgina d'inici
          cp docs/blog.models.html docs/index.html

      - name: Pujar documentació a GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 # Actualitzat a la versió v4 (més estable)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
